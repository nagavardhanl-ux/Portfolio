<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=block"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #0b0b0c;
        color: #f5f5f7;
        font-family: Inter, sans-serif;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background-image: radial-gradient(#26262c 1px, transparent 1px);
        background-size: 28px 28px;
      }
      .top { display: flex; justify-content: space-between; font: 15px/1 "JetBrains Mono", monospace; letter-spacing: 0.12em; text-transform: uppercase; color: #9a9aa3; }
      .top b { color: #8fa8ff; font-weight: 400; }
      h1 { font: 400 92px/0.98 "Instrument Serif", serif; letter-spacing: -0.02em; max-width: 960px; }
      h1 em { color: #8fa8ff; }
      .rule { height: 1px; background: #26262c; margin-bottom: 28px; }
      .bottom { display: flex; justify-content: space-between; font-size: 22px; color: #9a9aa3; }
      .bottom span:first-child { color: #f5f5f7; }
    </style>
  </head>
  <body>
    <div class="top"><span>Portfolio</span><b>nagavardhanl-ux.github.io/Portfolio</b></div>
    <h1>B2B marketer.<br /><em>I build the websites too.</em></h1>
    <div>
      <div class="rule"></div>
      <div class="bottom"><span>Nagavardhan Reddy Lella</span><span>Product marketing · Demand generation · Websites &amp; SEO</span></div>
    </div>
  </body>
</html>
